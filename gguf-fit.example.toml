# gguf-fit の設定ファイル
#
# このファイルを ./gguf-fit.toml か ~/.config/gguf-fit/config.toml に置くと
# 読まれます (Windows は %APPDATA%\gguf-fit\config.toml)。
# $GGUF_FIT_CONFIG で明示指定もできます。
#
# 優先順位:
#   CLI フラグ > 環境変数 > このファイル > このマシンの実測 > 組み込み既定
#
# いま何が効いているかは `gguf-plan --show-config` で確認できます。
# 見つかった設定ファイルは**最初の1つだけ**で、複数はマージしません。


# ---- 出力 ----------------------------------------------------------------

# 出力メッセージの言語。"en"（既定）か "ja"。
# CLI フラグ・JSON のキー・生成される config.yaml の中身は翻訳されません。
lang = "ja"


# ---- VRAM 予算 -----------------------------------------------------------

# 使える VRAM (GiB)。**書かなければ nvidia-smi から自動検出**します
# (複数枚あるときは一番大きいカード)。Apple Silicon は統合メモリなので
# 搭載メモリの 75% を目安にします。
#
# 書く場面:
#   ・他人のマシン向けに計画を立てるとき (例: 読者の 24GB カードを想定)
#   ・小さいほうのカードに載せたいとき
#   ・macOS で iogpu.wired_limit_mb を上げているとき
# vram = 24.0

# 計算バッファ・CUDAコンテキスト・投機デコードの見込み (GiB)。
# 既定 1.0 は Qwen3.8-27B の実測 0.67 を安全側に丸めたもの。
# 自分の環境で測ったら、その値に寄せてください。
# overhead = 1.0


# ---- KV の1トークンあたりバイト数 (実測) ---------------------------------

# **書かなければ GGUF から計算します。**計算値は下振れします:
#
#   f16    計算 68.0 KB/token   →  実測 69.1  (1.02倍)
#   q8_0   理論 36.1 KB/token   →  実測 43.1  (1.19倍)
#
# q8_0 のずれが大きいのは、比 0.531 が格納形式だけの話で、逆量子化の作業領域が
# 入っていないためです。この差で「24GiB に ctx 131,072 が載るか」の答えが
# 変わります (計算値なら載る、実測なら載らない)。
#
# 値は llama.cpp のバージョン・バックエンド・起動フラグで変わるので、
# **自分のマシンで測ってください**:
#
#   gguf-calibrate --model /models/your.gguf --ctx 32768,65536 --kv f16,q8_0
#
# 出てきた行をそのまま貼れます。どちらを使ったかは gguf-plan の出力に出ます。
# kv_f16_bytes = 70720
# kv_q8_bytes = 44096


# ---- GPU の検出 -----------------------------------------------------------

# GPU は `llama-server --list-devices` から拾います。llama.cpp 自身が認識して
# いる値なので、--device に書く識別子 (CUDA0 / ROCm0 / Vulkan0 ...) もここから
# 取れます。
#
# **llama.cpp はビルドに含まれるバックエンドしか出しません。**
# build-cuda の --list-devices に ROCm のデバイスは出ないので、複数のビルドを
# 使い分けているマシンでは全部並べてください。並べないと、実在する GPU を
# 見落とします。
# llama_servers = [
#   "/home/you/llm/apps/llama.cpp/build-cuda/bin/llama-server",
#   "/home/you/llm/apps/llama.cpp/build-rocm/bin/llama-server",
# ]

# 1本だけならこちらでも構いません
# llama_server = "/usr/local/bin/llama-server"


# ---- 生成される起動コマンド ----------------------------------------------

# llama-server の --threads。**書かなければ物理コア数を自動検出**します。
# 論理コア数を渡すと SMT の相方を奪い合って遅くなることがあるので、
# 物理コアに合わせるのが定石です。
# threads = 8

# 生成する起動コマンドに書く値
# device = "CUDA0"
# port = 8085

# -m に書くパス。通常は gguf-probe が記録した絶対パスが使われるので不要です。
# model_path = "/mnt/data/models/Qwen3.8-27B-GGUF/Qwen3.8-27B-Q5_K_M.gguf"
